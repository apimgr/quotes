# nginx proxy address - http://172.17.0.1:8080

name: quotes

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  quotes:
    image: ghcr.io/apimgr/quotes:latest
    container_name: quotes-app
    hostname: quotes
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PORT: 80
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./volumes/config:/config
      - ./volumes/data:/data
    ports:
      - "172.17.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/server/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - quotes

networks:
  quotes:
    name: quotes
    external: false
