site_name: quotes Documentation
site_description: High-performance REST API server for multiple quote collections
site_author: apimgr

repo_name: apimgr/quotes
repo_url: https://github.com/apimgr/quotes
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2024 apimgr

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to auto mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to dark mode
  font:
    text: Roboto
    code: Fira Code
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - API Reference: api.md
  - CLI: cli.md
  - Security: security.md
  - Integrations: integrations.md
  - Development: development.md
  - GitHub: https://github.com/apimgr/quotes

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji
  - toc:
      permalink: true
  - tables
  - attr_list

plugins:
  - search
  - minify:
      minify_html: true

extra_css:
  - stylesheets/dracula.css

extra_javascript:
  - javascripts/extra.js
